<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3158"/>
      <stop offset="1" stop-color="#145487"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36d6ff"/>
      <stop offset="1" stop-color="#8e7dff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .cn { font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
      .title { font-size: 42px; font-weight: 700; fill: #f4f9ff; }
      .subtitle { font-size: 21px; font-weight: 400; fill: #c1dcf3; }
      .num { font-size: 18px; font-weight: 700; fill: #45d9ff; letter-spacing: 2px; }
      .cardTitle { font-size: 27px; font-weight: 650; fill: #f4f9ff; }
      .body { font-size: 18px; font-weight: 400; fill: #d2e6f7; }
      .bottom { font-size: 22px; font-weight: 600; fill: #dcecff; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="1600" height="640" rx="28" fill="url(#bg)"/>
  <circle cx="140" cy="70" r="190" fill="#40bfee" opacity="0.18"/>
  <circle cx="1500" cy="600" r="260" fill="#7968dc" opacity="0.24"/>
  <path d="M70 505 C420 440, 560 555, 860 485 S1330 430, 1530 490" fill="none" stroke="#1e77a8" stroke-width="1" opacity="0.26"/>

  <text class="cn title" x="76" y="88">从应用到芯片，打通边端大模型推理全栈</text>
  <text class="cn subtitle" x="76" y="128">围绕真实 Agent 负载，以端到端体验牵引模型、系统与硬件协同优化</text>

  <g transform="translate(76 190)">
    <rect width="338" height="245" rx="20" fill="#15517f" stroke="#63c7ed"/>
    <rect x="0" y="0" width="338" height="5" rx="3" fill="#34d4ff" filter="url(#glow)"/>
    <text class="cn num" x="26" y="45">01 · WORKLOAD</text>
    <text class="cn cardTitle" x="26" y="88">负载分析与性能建模</text>
    <text class="cn body" x="26" y="132"><tspan x="26">Agent 工作流 · LLM 负载特征</tspan><tspan x="26" dy="34">性能瓶颈 · 资源效率</tspan><tspan x="26" dy="34">架构评估与优化依据</tspan></text>
  </g>

  <g transform="translate(446 190)">
    <rect width="338" height="245" rx="20" fill="#176493" stroke="#b5f5ff" stroke-width="2.5"/>
    <rect x="0" y="0" width="338" height="7" rx="3" fill="#7be9ff" filter="url(#glow)"/>
    <text class="cn num" x="26" y="45">02 · INFRA</text>
    <text class="cn cardTitle" x="26" y="88">推理系统深度优化</text>
    <text class="cn body" x="26" y="132"><tspan x="26">vLLM · SGLang · Runtime</tspan><tspan x="26" dy="34">调度 · 内存 · 异构计算</tspan><tspan x="26" dy="34">低延迟与高吞吐</tspan></text>
  </g>

  <g transform="translate(816 190)">
    <rect width="338" height="245" rx="20" fill="#15517f" stroke="#63c7ed"/>
    <rect x="0" y="0" width="338" height="5" rx="3" fill="#5da7ff" filter="url(#glow)"/>
    <text class="cn num" x="26" y="45">03 · KERNEL</text>
    <text class="cn cardTitle" x="26" y="88">硬件感知 Kernel 创新</text>
    <text class="cn body" x="26" y="132"><tspan x="26">算子优化 · 融合 · 内存访问</tspan><tspan x="26" dy="34">新型 AI 芯片能力释放</tspan><tspan x="26" dy="34">软硬件协同设计</tspan></text>
  </g>

  <g transform="translate(1186 190)">
    <rect width="338" height="245" rx="20" fill="#15517f" stroke="#63c7ed"/>
    <rect x="0" y="0" width="338" height="5" rx="3" fill="#8d7cff" filter="url(#glow)"/>
    <text class="cn num" x="26" y="45">04 · EXPERIENCE</text>
    <text class="cn cardTitle" x="26" y="88">端侧 Demo 与应用验证</text>
    <text class="cn body" x="26" y="132"><tspan x="26">真实 Agent 场景</tspan><tspan x="26" dy="34">算法 · 系统 · 硬件联调</tspan><tspan x="26" dy="34">从技术指标走向用户体验</tspan></text>
  </g>

  <line x1="126" y1="518" x2="1474" y2="518" stroke="url(#line)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="126" cy="518" r="9" fill="#36d6ff"/>
  <circle cx="1474" cy="518" r="9" fill="#8e7dff"/>
  <text class="cn bottom" x="800" y="574" text-anchor="middle">Agent 应用牵引  →  推理系统优化  →  Kernel 加速  →  硬件能力释放</text>
</svg>
