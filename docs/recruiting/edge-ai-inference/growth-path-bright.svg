<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3158"/><stop offset="1" stop-color="#263b84"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#45ddff"/><stop offset="1" stop-color="#9a86ff"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .cn{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
      .title{font-size:40px;font-weight:750;fill:#f6fbff}.sub{font-size:20px;fill:#c7dff2}
      .num{font-size:22px;font-weight:800;fill:#082b49}.ct{font-size:24px;font-weight:700;fill:#f7fbff}.body{font-size:17px;fill:#c7def0}
      .foot{font-size:21px;font-weight:650;fill:#e9f7ff}
    </style>
  </defs>
  <rect width="1600" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="1470" cy="10" r="250" fill="#42c9ff" opacity=".10"/><circle cx="80" cy="520" r="220" fill="#8c76ff" opacity=".12"/>
  <text class="cn title" x="74" y="78">从 0 到 1：逐步建立 AI Infra 能力栈</text>
  <text class="cn sub" x="74" y="116">不要求一开始覆盖全栈，先找到切入点，再在真实项目中持续深入</text>
  <line x1="192" y1="247" x2="1408" y2="247" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>

  <g transform="translate(100 178)">
    <circle cx="92" cy="69" r="39" fill="#59e1ff"/><text class="cn num" x="92" y="77" text-anchor="middle">01</text>
    <rect x="0" y="121" width="270" height="156" rx="18" fill="#164f7b" stroke="#65ccee"/>
    <text class="cn ct" x="24" y="164">基础入门</text>
    <text class="cn body" x="24" y="202"><tspan x="24">理解 LLM 推理链路</tspan><tspan x="24" dy="29">性能指标与边端约束</tspan></text>
  </g>
  <g transform="translate(476 178)">
    <circle cx="92" cy="69" r="39" fill="#60d0ff"/><text class="cn num" x="92" y="77" text-anchor="middle">02</text>
    <rect x="0" y="121" width="270" height="156" rx="18" fill="#164f7b" stroke="#65ccee"/>
    <text class="cn ct" x="24" y="164">框架实战</text>
    <text class="cn body" x="24" y="202"><tspan x="24">从 vLLM / SGLang</tspan><tspan x="24" dy="29">等主流框架切入</tspan></text>
  </g>
  <g transform="translate(852 178)">
    <circle cx="92" cy="69" r="39" fill="#74b3ff"/><text class="cn num" x="92" y="77" text-anchor="middle">03</text>
    <rect x="0" y="121" width="270" height="156" rx="18" fill="#164f7b" stroke="#76b9f4"/>
    <text class="cn ct" x="24" y="164">真实项目</text>
    <text class="cn body" x="24" y="202"><tspan x="24">在真实硬件与 Agent 场景</tspan><tspan x="24" dy="29">定位并解决性能问题</tspan></text>
  </g>
  <g transform="translate(1228 178)">
    <circle cx="92" cy="69" r="39" fill="#9a86ff"/><text class="cn num" x="92" y="77" text-anchor="middle">04</text>
    <rect x="0" y="121" width="270" height="156" rx="18" fill="#284b84" stroke="#a896ff"/>
    <text class="cn ct" x="24" y="164">全栈进阶</text>
    <text class="cn body" x="24" y="202"><tspan x="24">逐步深入 Runtime</tspan><tspan x="24" dy="29">系统优化与 Kernel</tspan></text>
  </g>
</svg>
